<!DOCTYPE html>
<!-- text-slot uses synthetic text measurement, absent in Chrome. -->
<div style="width: 375px; height: 750px;" data-chrome="false">
  <div style="position: fixed; left: 100px; top: 40px; width: 200px; height: 200px; direction: rtl;">
    <text-slot len="15" fontSize="20" style="position: fixed;"
               data-expect-left="0" data-expect-top="40" data-expect-width="300" data-expect-height="20"></text-slot>
    <text-slot len="15" fontSize="20" style="position: fixed; right: 75px; top: 40px;"
               data-expect-left="0" data-expect-top="40" data-expect-width="300" data-expect-height="20"></text-slot>
  </div>
</div>
