<!DOCTYPE html>
<!-- text-slot uses synthetic text measurement, absent in Chrome. -->
<div style="display: flow-root; width: 375px; height: 750px;" data-chrome="false">
  <div style="position: relative; margin-left: 100px; width: 200px; height: 200px;">
    <text-slot len="15" fontSize="20" style="position: fixed;"
               data-expect-left="100" data-expect-top="0" data-expect-width="260" data-expect-height="40"></text-slot>
    <text-slot len="15" fontSize="20" style="position: fixed; left: 100px; top: 0;"
               data-expect-left="100" data-expect-top="0" data-expect-width="260" data-expect-height="40"></text-slot>
  </div>
</div>
