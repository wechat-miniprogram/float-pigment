<!DOCTYPE html>
<!-- Nested expectations are parent-relative; the Chrome script compares viewport coordinates. -->
<div style="width: 200px; height: 200px; position: relative; font-size: 0; line-height: 0;" data-chrome="false">
  <div style="width: 200px; height: 30px;"></div>
  <div style="display: inline; position: relative; direction: rtl; width: 50px; height: 20px;"
       data-expect-left="0" data-expect-top="30">
    <div style="display: inline-block; width: 50px; height: 20px;"></div>
    <div style="display: inline; position: absolute; width: 20px; height: 20px;"
         data-expect-left="50" data-expect-top="0"></div>
  </div>
</div>
